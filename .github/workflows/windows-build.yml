name: Windows build

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  test:
    name: Run automated tests
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73
        with:
          dotnet-version: 10.0.x
      - name: Run automated tests
        run: dotnet run --project src/SmartNetworkOptimizer.Tests/SmartNetworkOptimizer.Tests.csproj --configuration Release
  publish:
    name: Publish ${{ matrix.rid }}
    needs: test
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        rid: [win-x64, win-arm64]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore src/SmartNetworkOptimizer/SmartNetworkOptimizer.csproj --runtime ${{ matrix.rid }}

      - name: Publish single-file application
        run: >-
          dotnet publish src/SmartNetworkOptimizer/SmartNetworkOptimizer.csproj
          -c Release -r ${{ matrix.rid }} --self-contained true --no-restore
          -o artifacts/${{ matrix.rid }}
          /p:PublishSingleFile=true
          /p:IncludeNativeLibrariesForSelfExtract=true
          /p:EnableCompressionInSingleFile=true
          /p:PublishTrimmed=false
          /p:DebugType=None /p:DebugSymbols=false

      - name: Package and checksum
        shell: pwsh
        run: |
          $name = "SmartNetworkOptimizer-${{ matrix.rid }}"
          Compress-Archive -Path "artifacts/${{ matrix.rid }}/*" -DestinationPath "artifacts/$name.zip" -CompressionLevel Optimal
          $hash = (Get-FileHash "artifacts/$name.zip" -Algorithm SHA256).Hash.ToLowerInvariant()
          Set-Content -Path "artifacts/$name.zip.sha256" -Value "$hash  $name.zip" -Encoding ascii

      - name: Upload build artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: SmartNetworkOptimizer-${{ matrix.rid }}
          path: |
            artifacts/SmartNetworkOptimizer-${{ matrix.rid }}.zip
            artifacts/SmartNetworkOptimizer-${{ matrix.rid }}.zip.sha256
          if-no-files-found: error

  publish-release:
    name: Publish GitHub release assets
    if: startsWith(github.ref, 'refs/tags/v')
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          path: release-assets
      - name: Flatten release assets
        shell: bash
        run: |
          mkdir -p release-files
          find release-assets -type f \( -name '*.zip' -o -name '*.sha256' \) -print0 | xargs -0 -I{} cp "{}" release-files/
          test -n "$(find release-files -type f -name '*.zip' -print -quit)"
      - name: Create GitHub release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64
        with:
          files: release-files/*
          generate_release_notes: true
